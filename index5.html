<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>3D specimen viewer · Biometrics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050606;
  --glass:rgba(29,32,30,.74);
  --glass-hi:rgba(44,48,45,.72);
  --line:rgba(255,255,255,.07);
  --ink:#eef1ea;
  --dim:#8d928a;
  --faint:#5a5f58;
  --lime:#d3f28c;
  --lime-ink:#1b2410;
  --yellow:#f3e23d;
  --red:#ff4f4f;
  --green:#33d68f;
  --r-xl:28px; --r-lg:22px; --r-md:16px;
  --lw:300px; --rw:352px;
  font-family:"Outfit","Avenir Next","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased;font-weight:300}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,.dots:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}

#app{position:relative;width:100%;height:100vh;height:100dvh;overflow:hidden;
  background:
    radial-gradient(60% 55% at 50% 48%, rgba(40,46,40,.55), transparent 70%),
    radial-gradient(rgba(255,255,255,.07) 1px, transparent 1.2px) 0 0/26px 26px,
    var(--bg);}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}

/* ---------- glass primitives ---------- */
.glass{background:linear-gradient(180deg,rgba(40,44,41,.80),rgba(26,29,27,.80));border:1px solid var(--line);
  backdrop-filter:blur(22px) saturate(1.1);-webkit-backdrop-filter:blur(22px) saturate(1.1);box-shadow:0 18px 50px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.04)}
.pill{display:inline-flex;align-items:center;gap:9px;height:44px;padding:0 18px;border-radius:999px;font-size:14px;white-space:nowrap;
  background:rgba(34,37,35,.82);border:1px solid var(--line);backdrop-filter:blur(18px);transition:background .2s,color .2s}
.pill:hover{background:rgba(52,56,52,.9)}
.pill .k{color:var(--dim)} .pill .v{color:var(--ink)}
.pill.on,.pill.lime{background:var(--lime);color:var(--lime-ink);border-color:transparent}
.pill.lime .k{color:rgba(27,36,16,.62)} .pill.lime .v{color:var(--lime-ink)}
.round{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:19px;background:rgba(34,37,35,.82);border:1px solid var(--line);backdrop-filter:blur(18px);position:relative}
.round:hover{background:rgba(54,58,54,.9)}
.round .badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--red);font-size:10.5px;font-weight:500;display:grid;place-items:center;padding:0 4px}

/* ---------- top bar ---------- */
.topbar{position:absolute;z-index:30;left:20px;right:20px;top:calc(18px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:10px}
.spacer{flex:1}
.modeinfo{position:absolute;left:24px;top:0;width:min(520px,calc(50vw - 170px));transition:opacity .18s}
.modeinfo.swap{opacity:0}
.modeinfo{display:flex;align-items:center;gap:12px;height:44px;white-space:nowrap}
.modeinfo h2{margin:0;font-size:17px;font-weight:400}
.modeinfo p{margin:0;font-size:13px;color:var(--dim)}
.modeinfo .leg{display:flex;align-items:center;gap:12px;font-size:11.5px;font-weight:300;color:var(--dim)}
.modeinfo .leg span{display:flex;align-items:center;gap:6px}
.modeinfo .leg i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.modeinfo .grad{width:110px;height:6px;border-radius:6px;background:linear-gradient(90deg,#4f6b86,#ff4f4f)}
.topbar .tabs{display:flex;gap:10px;position:absolute;left:50%;transform:translateX(-50%)}

/* ---------- menus ---------- */
.menu{position:fixed;z-index:80;min-width:230px;padding:8px;border-radius:20px;background:rgba(26,29,27,.96);border:1px solid var(--line);backdrop-filter:blur(24px);box-shadow:0 24px 60px rgba(0,0,0,.6);animation:pop .14s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.menu button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:16px;text-align:left;padding:10px 12px;border-radius:12px;font-size:14px}
.menu button:hover{background:rgba(255,255,255,.07)}
.menu button.active{background:rgba(211,242,140,.14);color:var(--lime)}
.menu button small{color:var(--dim);font-size:12px}
.menu .sep{height:1px;background:var(--line);margin:6px 4px}

/* ---------- left column ---------- */
.left{position:absolute;z-index:20;left:20px;top:calc(82px + env(safe-area-inset-top,0px));bottom:20px;width:var(--lw);display:flex;flex-direction:column;gap:12px;overflow-y:auto;scrollbar-width:none;padding-bottom:4px;transition:transform .3s}
.left::-webkit-scrollbar{display:none}
.who{display:flex;align-items:center;gap:14px;padding:2px 4px 4px}
.who h1{margin:0;font-weight:300;font-size:32px;letter-spacing:-.01em;line-height:1.05}
.who p{margin:3px 0 0;font-size:12px;color:var(--dim)}
.specpick{margin-left:auto;max-width:190px;font:12px/1.2 inherit;color:var(--dim);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);border-radius:9px;padding:6px 8px;cursor:pointer}
.specpick:disabled{opacity:.5;cursor:default}
.specpick option{color:#111}
.profile{flex:none;border-radius:var(--r-xl);overflow:hidden;position:relative;transition:background .5s}
.profile .top{padding:20px 20px 4px}
.profile h3{margin:0 0 14px;font-weight:300;font-size:17px;display:flex;justify-content:space-between;align-items:center}
.rtabs{display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(255,255,255,.07);margin:0 0 18px}
.rtabs button{flex:1;height:30px;border-radius:999px;font-size:12.5px;color:var(--dim)}
.rtabs button.on{background:rgba(255,255,255,.15);color:var(--ink)}
.profile.collapsed .pbody{display:none}
.profile.collapsed .top{padding-bottom:0}
.profile h3 button{display:flex;color:var(--ink);width:100%;justify-content:space-between;align-items:center;font-weight:300;font-size:17px}
.profile h3 .chev{font-size:18px;transition:transform .2s}
.profile.collapsed h3 .chev{transform:rotate(180deg)}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:12px;color:var(--dim);text-align:center}
.cols3 b{display:block;margin-top:4px;font-weight:300;font-size:14.5px;color:var(--ink)}
.trend{margin:22px 0 0;padding:16px 20px 18px;border-radius:20px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.04)}
.trend .row{display:flex;justify-content:space-between;font-size:14.5px;margin-bottom:12px}
.trend canvas{width:100%;height:14px;display:block}
.conf{padding:4px 20px 20px}
.conf .hd{display:flex;justify-content:space-between;align-items:center;font-size:15px}
.conf .st{display:flex;align-items:center;gap:8px}
.conf .sub{font-size:11.5px;line-height:1.35;color:var(--dim);margin:6px 0 16px}
.conf .bar{margin-top:14px;position:relative;height:6px;border-radius:6px;background:linear-gradient(90deg,#ff4f4f,#f3e23d 55%,#33d68f)}
.conf .bar i{position:absolute;top:50%;width:15px;height:15px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 0 4px rgba(255,255,255,.18),0 2px 8px rgba(0,0,0,.5)}
.conf .nums{display:flex;justify-content:space-between;margin-top:12px;font-size:14px}
.conf .note2{margin-top:12px;font-size:11px;line-height:1.4;color:var(--faint)}
.conf .nums small{display:block;font-size:10.5px;color:var(--dim);margin-top:1px}
.status{display:flex;align-items:center;justify-content:space-between;padding:20px;gap:10px}
.status .lbl{font-size:15px}.status .lbl small{display:block;margin-top:6px;font-size:11px;color:var(--dim)}
.status .st{display:flex;align-items:center;gap:9px;font-size:15px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--c,var(--lime))}
.range{display:grid;grid-template-columns:auto 10px 36px;align-items:center;column-gap:6px;row-gap:3px;font-size:13px;min-width:92px}
.range i{width:7px;height:7px;border-radius:50%;display:block}
.range s{height:2px;border-radius:2px;display:block;text-decoration:none}
.tint-ok{background:radial-gradient(130% 90% at 0% 0%,rgba(122,120,38,.62),rgba(36,38,33,.55) 62%),rgba(30,32,28,.8)}
.tint-mid{background:radial-gradient(130% 90% at 0% 0%,rgba(130,100,34,.55),rgba(36,36,32,.55) 62%),rgba(30,32,28,.8)}
.tint-bad{background:radial-gradient(130% 90% at 0% 0%,rgba(150,40,40,.7),rgba(40,30,30,.55) 62%),rgba(30,28,28,.8)}

/* ---------- right column ---------- */
.right{position:absolute;z-index:20;right:20px;top:calc(82px + env(safe-area-inset-top,0px));bottom:20px;width:var(--rw);display:flex;flex-direction:column;gap:12px;transition:transform .3s}
.hint{display:none;margin:-4px 6px 0;font-size:11.5px;color:var(--dim)}
.systabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.systabs::-webkit-scrollbar{display:none}
.systabs .pill{height:40px;padding:0 16px;font-size:13.5px}
.systabs .round{width:40px;height:40px;font-size:17px;flex:none}
.rtop{display:flex;gap:10px;align-items:center}
.search{flex:1;display:flex;align-items:center;gap:10px;height:44px;padding:0 16px;border-radius:999px;background:rgba(34,37,35,.82);border:1px solid var(--line);color:var(--dim);font-size:15px}
.search input{flex:1;min-width:0;background:none;border:0;color:var(--ink);font:inherit;font-size:14px;outline:none}
.search:focus-within{border-color:rgba(211,242,140,.5)}
.rtop .round{width:44px;height:44px;flex:none}
.cards{overflow-y:auto;columns:2;column-gap:10px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.15) transparent;padding:2px 2px 30px;flex:1}
.cards .empty{column-span:all;padding:24px 8px;color:var(--dim);font-size:14px}
.card{break-inside:avoid;margin:0 0 10px;border-radius:var(--r-lg);padding:16px 16px 14px;text-align:left;width:100%;display:block;position:relative;
  background:linear-gradient(180deg,rgba(40,44,41,.76),rgba(27,30,28,.78));border:1px solid var(--line);backdrop-filter:blur(20px);transition:border-color .2s,transform .2s,background .2s}
.card:hover,.card.hov{border-color:rgba(211,242,140,.35);background:linear-gradient(180deg,rgba(52,57,52,.8),rgba(30,33,30,.8))}
.card.sel{border-color:rgba(243,226,61,.7);box-shadow:0 0 0 1px rgba(243,226,61,.25),0 0 40px rgba(243,226,61,.08)}
.card .t{display:flex;align-items:flex-start;gap:8px;font-size:13.5px;line-height:1.25;min-height:34px}
.card .t i{width:2.5px;height:16px;margin-top:1px;border-radius:2px;background:var(--c);flex:none}
.card .t em{font-style:normal}
.card .t span{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.card .n{display:flex;align-items:baseline;gap:0;margin-top:14px;font-size:34px;font-weight:200;letter-spacing:-.02em;line-height:1;position:relative}
.card .n .frac{color:var(--dim)}
.card .n .unit{font-size:13px;font-weight:300;color:var(--dim);letter-spacing:0;margin-left:5px}
.card .t .ar{margin-left:auto;font-size:16px;color:var(--ink);display:flex}
.chip{display:inline-flex;align-items:center;margin-top:12px;padding:5px 11px;border-radius:999px;font-size:12px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.strip{display:block;width:100%;height:56px;margin-top:10px}
.card .note{margin:8px 0 0;font-size:12.5px;line-height:1.35;color:var(--dim)}
.card.big .n{font-size:34px}

/* ---------- 3D overlays ---------- */
#tip{position:absolute;z-index:40;pointer-events:none;padding:7px 13px;border-radius:12px;background:rgba(18,20,18,.92);border:1px solid var(--line);font-size:13px;opacity:0;transform:translate(-50%,-135%);transition:opacity .12s;white-space:nowrap}
#tip.show{opacity:1}#tip small{color:var(--dim);margin-left:8px}

.detail{position:absolute;z-index:14;left:0;top:0;width:292px;border-radius:26px;padding:20px 22px 16px;opacity:0;pointer-events:none;transition:opacity .25s;will-change:transform;
  background:linear-gradient(90deg,rgba(80,84,80,.42) 0%,rgba(38,41,38,.82) 46%),rgba(26,28,26,.8);overflow:hidden}
.detail.show{opacity:1;pointer-events:auto}
.detail::before{content:"";position:absolute;left:0;top:0;bottom:0;width:46%;backdrop-filter:blur(14px);-webkit-mask:linear-gradient(90deg,#000,transparent);mask:linear-gradient(90deg,#000,transparent);pointer-events:none}
.detail header{position:relative;display:flex;align-items:center;gap:10px;margin-bottom:14px}
.detail h5{margin:0;font-weight:400;font-size:17px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.detail .tag{font-size:11px;color:var(--c)}
.detail .x{font-size:17px;color:var(--ink)}
.detail dl{position:relative;margin:0;display:grid;grid-template-columns:auto 1fr;row-gap:11px;column-gap:18px;font-size:14px}
.detail dt{color:rgba(238,241,234,.34)} .detail dd{margin:0;text-align:right;white-space:nowrap}
.detail dd small{color:var(--dim)}
.detail footer{position:relative;display:flex;gap:8px;margin-top:16px}
.detail footer button{flex:1;height:36px;border-radius:12px;background:rgba(255,255,255,.07);font-size:13px}
.detail footer button:hover{background:rgba(255,255,255,.13)}
.detail footer button.on{background:var(--lime);color:var(--lime-ink)}

.histo{border-radius:var(--r-xl);padding:4px 6px 6px;position:relative;flex:none}
.histo header{display:flex;align-items:center}
.hh{flex:1;display:flex;align-items:center;gap:10px;height:50px;padding:0 10px 0 16px;font-size:17px;font-weight:300;text-align:left;border-radius:20px}
.hh small{font-size:12px;color:var(--dim);margin-left:auto;white-space:nowrap}
.histo:not(.collapsed) .hh small{margin-right:38px}
.hh .chev{font-size:18px;transition:transform .2s}
.histo.collapsed .hh .chev{transform:rotate(180deg)}
.histo.collapsed .hbody2{display:none}
#hPin{position:absolute;right:46px;top:11px;width:30px;height:30px;border-radius:50%;display:none;place-items:center;color:var(--dim);font-size:15px}
.histo:not(.collapsed) #hPin{display:grid}
#hPin:hover{color:var(--ink)} #hPin.on{background:var(--lime);color:var(--lime-ink)}
.hbody2{display:flex;gap:14px;padding:4px 12px 12px}
.hbody{position:relative;border-radius:16px;overflow:hidden;background:#07080a;height:214px;aspect-ratio:1126/1821;flex:none}
.hbody canvas{width:100%;height:100%;display:block}
.hbody .sp{position:absolute;inset:0;display:none;place-items:center}
.hbody .sp.on{display:grid}.hbody .sp::after{content:"";width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.2);border-top-color:var(--lime);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hside{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;padding-top:4px}
.hread{display:grid;font-size:14px}
.hread span{font-size:11px;color:var(--dim)}
.hread b{font-weight:300;margin-bottom:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hmsg{font-size:11.5px;line-height:1.35;color:var(--dim)}

/* radial tool */
.arc{position:absolute;z-index:11;left:calc(var(--lw) + 52px);top:calc(50% - 150px);width:290px;height:260px}
.arc svg.path{position:absolute;left:110px;top:0;width:190px;height:230px;overflow:visible}
.arc .nd{position:absolute;width:46px;height:46px;border-radius:16px;display:grid;place-items:center;font-size:20px;background:rgba(40,43,40,.7);border:1px solid var(--line);color:var(--dim);backdrop-filter:blur(12px);transition:.2s}
.arc .nd.on{background:rgba(255,255,255,.88);color:#111;box-shadow:0 0 30px rgba(255,255,255,.2)}
.arc .nd:hover{color:var(--ink)} .arc .nd.on:hover{color:#111}
.arc .nd:nth-child(1){left:60px;top:8px}.arc .nd:nth-child(2){left:26px;top:68px}.arc .nd:nth-child(3){left:12px;top:132px}.arc .nd:nth-child(4){left:34px;top:196px}
.arc .lab{position:absolute;left:150px;top:236px;font-size:12px;color:var(--dim);white-space:nowrap}
#handle{cursor:grab;touch-action:none}

/* timeline */
.timeline{position:absolute;z-index:25;left:50%;transform:translateX(-50%);bottom:20px;display:flex;align-items:stretch;gap:6px;padding:8px;border-radius:30px;white-space:nowrap}
.seg{display:flex;align-items:center;gap:6px;padding:0 6px 0 4px;border-radius:24px}
.seg + .seg{border-left:1px solid var(--line);padding-left:14px;margin-left:4px}
.seg .lbl{font-size:11px;line-height:1.25;color:var(--dim);text-align:left;min-width:40px}
.seg .lbl b{display:block;font-weight:300;color:var(--ink);font-size:12px}
.seg .ic{width:46px;height:46px;border-radius:17px;display:grid;place-items:center;font-size:19px;background:rgba(255,255,255,.1);color:var(--ink)}
.seg .ic.on{background:rgba(211,242,140,.25);color:var(--lime)}
.seg .read{font-size:12.5px;color:var(--dim);min-width:52px;display:none}
.seg .read.on{display:block}
.rng{-webkit-appearance:none;appearance:none;width:190px;height:46px;background:transparent;cursor:pointer;margin:0 4px;--p:50%}
.rng.sm{width:120px}
.rng:focus{outline:none}.rng:focus-visible{outline:2px solid var(--lime);outline-offset:2px;border-radius:12px}
.rng::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--lime) var(--p),rgba(255,255,255,.18) var(--p))}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-8px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 6px rgba(255,255,255,.12),0 2px 8px rgba(0,0,0,.5)}
.rng::-moz-range-track{height:4px;border-radius:4px;background:rgba(255,255,255,.18)}
.rng::-moz-range-progress{height:4px;border-radius:4px;background:var(--lime)}
.rng::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 6px rgba(255,255,255,.12)}
.dots{position:relative;display:flex;justify-content:space-between;align-items:center;width:92px;height:46px;padding:0 8px;cursor:pointer;touch-action:none}
.dots b{width:6px;height:6px;border-radius:50%;background:#e6e9e1}
.dots .ring{position:absolute;top:50%;left:calc(8px + (100% - 16px)*var(--f,0));width:17px;height:17px;border:1.5px solid #fff;border-radius:50%;transform:translate(-50%,-50%);transition:left .12s}
.dots .ring::after{content:"";position:absolute;inset:3.5px;background:#fff;border-radius:50%}
.zoom{position:absolute;z-index:25;right:calc(var(--rw) + 40px);bottom:96px;display:flex;flex-direction:column;gap:8px}
.zoom .round{width:46px;height:46px;border-radius:18px;font-size:19px}
.zoom .round.on{background:var(--lime);color:var(--lime-ink)}

/* loading */
#loading{position:absolute;inset:0;z-index:100;display:grid;place-content:center;justify-items:center;gap:16px;background:var(--bg);transition:opacity .6s,visibility .6s;text-align:center;padding:24px}
#loading.gone{opacity:0;visibility:hidden}
#loading .ring{width:54px;height:54px;border-radius:50%;border:2px solid rgba(255,255,255,.1);border-top-color:var(--lime);animation:spin 1s linear infinite}
#loading h2{margin:0;font-weight:200;font-size:30px}
#loading p{margin:0;color:var(--dim);font-size:14px;max-width:420px}
#loading.err .ring{animation:none;border-color:var(--red)}

/* responsive */
.tgl{display:none}
@media (max-width:1320px){ }
@media (max-width:1040px){
  .modeinfo{display:none}
  .left{transform:translateX(calc(-100% - 40px));z-index:50;background:rgba(5,6,6,.9);padding:12px;border-radius:28px;left:12px;bottom:12px;top:calc(76px + env(safe-area-inset-top,0px))}
  .right{transform:translateX(calc(100% + 40px));z-index:50;background:rgba(5,6,6,.9);padding:12px;border-radius:28px;right:12px;bottom:12px;top:calc(76px + env(safe-area-inset-top,0px));width:min(380px,calc(100vw - 24px))}
  .left{width:min(320px,calc(100vw - 24px))}

const si = $("searchInput");
si.addEventListener("input", () => { S.q = si.value; renderCards(); });
$("tglL").addEventListener("click", () => { document.body.classList.toggle("showL"); document.body.classList.remove("showR"); });
$("tglR").addEventListener("click", () => { document.body.classList.toggle("showR"); document.body.classList.remove("showL"); });

// zoom + auto-rotate
function zoom(k) { const d = camera.position.clone().sub(controls.target); flyTo(controls.target.clone().add(d.multiplyScalar(k)), controls.target.clone(), 0.35); }
$("zIn").addEventListener("click", () => zoom(0.75)); $("zOut").addEventListener("click", () => zoom(1.35));
function setAuto(v) { S.auto = v; controls.autoRotate = v; $("z3d").classList.toggle("on", v); }
$("z3d").addEventListener("click", () => setAuto(!S.auto));
function introSpin() { /* a single deliberate moment: ease the camera into its default framing once the model is ready */ flyTo(defaultPos, defaultTgt, 1.4); }

/* ---------- explode arc ---------- */
(() => {
  const h = $("handle"), cx = 170, cy = 190, r = 150;
  const place = (t) => { const th = Math.PI + t * Math.PI / 2; h.setAttribute("transform", `translate(${cx + r * Math.cos(th)} ${cy + r * Math.sin(th)})`); };
  place(0); let down = false;
  const move = (e) => {
    const s = $("arcSvg"), pt = s.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const p = pt.matrixTransform(s.getScreenCTM().inverse());
    let th = Math.atan2(p.y - cy, p.x - cx); if (th > 0) th = th > Math.PI / 2 ? -Math.PI : 0; if (th < -Math.PI / 2 * 3) th += Math.PI * 2;
    const t = clamp((th + Math.PI) / (Math.PI / 2), 0, 1); S.explode = t; place(t); $("arcLab").textContent = `Explode ${Math.round(t * 100)}%`; applyExplode();
  };
  h.addEventListener("pointerdown", (e) => { down = true; h.setPointerCapture(e.pointerId); }); h.addEventListener("pointermove", (e) => { if (down) move(e); }); h.addEventListener("pointerup", () => { down = false; });
})();

/* ---------- exports ---------- */
function exportCSV() {
  const head = ["atlas_id", "name", "model_group", "voxels", "volume_mm3", "surface_mm2", "z0", "z1", "extent_x_mm", "extent_y_mm", "extent_z_mm", "holdout_dice"];
  const rows = ORDER.map((id) => { const r = ST.get(id), z = zRange(r), s = r.bbox ? r.bbox.getSize(new THREE.Vector3()) : null;
    return [id, `"${r.name.replace(/"/g, '""')}"`, r.tier, r.voxels, r.vol, r.area ?? "", z ? z[0] : "", z ? z[1] : "", s ? s.x.toFixed(4) : "", s ? s.y.toFixed(4) : "", s ? s.z.toFixed(4) : "", r.dice ?? ""].join(","); });
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([[head.join(","), ...rows].join("\n")], { type: "text/csv" })); a.download = `${SPECIMEN_ID}_morphometrics.csv`; a.click(); showToast("Morphometrics exported");
}
function savePNG() { renderer.render(scene, camera); const a = document.createElement("a"); a.href = renderer.domElement.toDataURL("image/png"); a.download = `${SPECIMEN_ID}_view.png`; a.click(); }
function copySummary() {
  const c = CAL();
  const t = `${SPECIMEN_ID}: ${ORDER.length} structures, ${volParts(TOTAL_VOL).n} ${volParts(TOTAL_VOL).u} labelled, ${c.nz} sections at ${c.xy.toFixed(3)} µm / ${c.z} µm.`;
  navigator.clipboard?.writeText(t).then(() => showToast("Summary copied"));
}

/* ---------- keyboard ---------- */
addEventListener("keydown", (e) => {
  if (e.target && /input|textarea/i.test(e.target.tagName) && true) { if (e.key === "Escape") { si.blur(); } return; }
  if (e.key === "Escape") { select(null); setPinned(false); document.body.classList.remove("showL", "showR"); return; }
  if (!slicesReady || S.z === null) return; let dz = 0;
  if (e.key === "ArrowRight" || e.key === "]") dz = e.shiftKey ? 10 : 1; if (e.key === "ArrowLeft" || e.key === "[") dz = e.shiftKey ? -10 : -1;
  if (!dz || e.target.getAttribute?.("role") === "slider") return; e.preventDefault();
  setZ(clamp(S.z + dz, 0, VOLUME.shape[0] - 1), true);
});

/* ==========================================================================================
   FRAME LOOP — camera, styles, anchored overlays, histology paint
   ========================================================================================== */
const tv = new THREE.Vector3();
function screenOf(rec) {
  if (!rec?.centroid) return null; tv.copy(rec.centroid); if (rec.dir) tv.addScaledVector(rec.dir, S.explode);
  modelRoot.localToWorld(tv); tv.project(camera); if (tv.z > 1) return null;
  return { x: (tv.x * 0.5 + 0.5) * W, y: (-tv.y * 0.5 + 0.5) * H };
}
function place(el, p, ox = 0, oy = 0, box) {
  if (!p) { el.classList.remove("show"); return false; }
  let x = p.x + ox, y = p.y + oy; if (box) { x = clamp(x, box.l, box.r - el.offsetWidth); y = clamp(y, box.t, box.b - el.offsetHeight); }
  el.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`; return true;
}
let last = performance.now(), frames = 0;
function animate(now = performance.now()) {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (fly.on) { fly.t = Math.min(1, fly.t + dt / fly.d); const k = ease(fly.t); camera.position.lerpVectors(fly.p0, fly.p1, k); controls.target.lerpVectors(fly.t0, fly.t1, k); if (fly.t >= 1) fly.on = false; }
  controls.update(); stepStyles(dt);
  // histology panel
  let ch = HS.dirty; HS.dirty = false;
  if (HS.fade < 1) { HS.fade = Math.min(1, HS.fade + dt / 0.14); ch = true; if (HS.fade >= 1) HS.prev = null; }
  const k = 1 - Math.exp(-dt * 20), dx = HS.tx - HS.mx, dy = HS.ty - HS.my;
  if (Math.abs(dx) > 2e-4 || Math.abs(dy) > 2e-4) { HS.mx += dx * k; HS.my += dy * k; ch = true; }
  if (ch) drawHisto();
  // anchored overlays (every 2nd frame is plenty)
  if ((frames++ & 1) === 0 && S.ready) {
    const sel = S.sel !== null ? ST.get(S.sel) : null; const box = { l: parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--lw")) + 40, r: W - parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--rw")) - 112, t: 84, b: H - 100 };
    const narrow = innerWidth <= 1040; if (narrow) { box.l = 12; box.r = W - 12; }
    if (sel) { const d = $("detail"); d.classList.toggle("show", place(d, screenOf(sel), 70, 18, box)); }
    else $("detail").classList.remove("show");
  }
  renderer.render(scene, camera);
}
animate();
setMode("xray");
</script>
